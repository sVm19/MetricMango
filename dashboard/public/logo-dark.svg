<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mangoShine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#F5C518;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F5C518" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ICON MARK: Stylized Mango + Chart Bar Fusion -->
  <!-- Mango body shape -->
  <g transform="translate(16, 12)">
    <!-- Outer mango silhouette -->
    <path d="M 68 112
             C 68 112 20 98 20 62
             C 20 30 42 12 68 12
             C 94 12 116 30 116 62
             C 116 98 68 112 68 112 Z"
          fill="url(#mangoGrad)" filter="url(#shadow)"/>

    <!-- Shine overlay -->
    <path d="M 68 112
             C 68 112 20 98 20 62
             C 20 30 42 12 68 12
             C 94 12 116 30 116 62
             C 116 98 68 112 68 112 Z"
          fill="url(#mangoShine)" opacity="0.5"/>

    <!-- Inner chart bars (cutout style = dark bars inside mango) -->
    <!-- Bar 1 (short) -->
    <rect x="34" y="72" width="14" height="24" rx="4" fill="#0D0D0D" opacity="0.75"/>
    <!-- Bar 2 (medium) -->
    <rect x="54" y="56" width="14" height="40" rx="4" fill="#0D0D0D" opacity="0.75"/>
    <!-- Bar 3 (tall) -->
    <rect x="74" y="44" width="14" height="52" rx="4" fill="#0D0D0D" opacity="0.75"/>
    <!-- Trend line dot on top of bar 3 -->
    <circle cx="81" cy="40" r="5" fill="#0D0D0D" opacity="0.75"/>
    <!-- Trend line connecting bars -->
    <polyline points="41,68 61,52 81,40" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/>

    <!-- Mango leaf / stem -->
    <path d="M 68 12 C 68 4 74 0 80 2 C 74 6 72 10 68 12 Z"
          fill="#2D7A3A"/>
    <path d="M 68 12 C 66 4 60 1 56 3 C 62 6 66 10 68 12 Z"
          fill="#3A9A4A"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(152, 0)">
    <!-- "metric" in light weight -->
    <text x="0" y="72"
          font-family="'Helvetica Neue', 'Arial', sans-serif"
          font-size="22"
          font-weight="300"
          letter-spacing="6"
          fill="#A1A1AA"
          text-anchor="start">METRIC</text>

    <!-- "mango" in bold -->
    <text x="-4" y="112"
          font-family="'Helvetica Neue', 'Arial Black', sans-serif"
          font-size="52"
          font-weight="900"
          letter-spacing="-2"
          fill="#FFFFFF"
          text-anchor="start">mango</text>

    <!-- Gold underline accent -->
    <rect x="0" y="120" width="210" height="5" rx="2.5" fill="url(#mangoGrad)"/>
  </g>
</svg>
